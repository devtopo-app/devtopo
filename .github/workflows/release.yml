# On a version tag on main (made on GitHub's "Draft a new release" page, or
# git tag v0.1.0 && git push origin v0.1.0): builds the Windows program, the
# Mac app and the Linux programs, and adds them, with their SHA-256 checksums,
# to that version's GitHub release.
name: Release

on:
  push:
    tags: ['v*']

# Read only, but for the release job, which uploads the downloads.
permissions:
  contents: read

jobs:
  # Releases come from main only: a tag on a commit main does not have stops here.
  from-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are made from main only."
            exit 1
          }

  windows:
    needs: from-main
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.x
      # windowsgui: no console window when started with a double-click.
      # updateRepo: the repository whose releases the in-app update check reads.
      - shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$VERSION -X main.updateRepo=$REPO" -o DevTopo.exe ./cmd/devtopo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: DevTopo.exe

  macos:
    needs: from-main
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.x
      # The menu-bar icon needs cgo, so both architectures build here, on a Mac.
      - name: Build for Apple silicon and Intel, as one program
        run: |
          flags="-s -w -X main.version=$GITHUB_REF_NAME -X main.updateRepo=$GITHUB_REPOSITORY"
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags "$flags" -o devtopo-arm64 ./cmd/devtopo
          CGO_ENABLED=1 GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" go build -trimpath -ldflags "$flags" -o devtopo-amd64 ./cmd/devtopo
          lipo -create -output devtopo devtopo-arm64 devtopo-amd64
      - name: Make DevTopo.app
        run: |
          mkdir -p DevTopo.app/Contents/MacOS
          cp devtopo DevTopo.app/Contents/MacOS/devtopo
          sed "s/VERSION/${GITHUB_REF_NAME#v}/" packaging/macos/Info.plist > DevTopo.app/Contents/Info.plist
          codesign --force --deep --sign - DevTopo.app
          ditto -c -k --keepParent DevTopo.app DevTopo-mac.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: DevTopo-mac.zip

  linux:
    needs: from-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.x
      # The Linux tray talks DBus in pure Go, so no cgo: one static program per architecture.
      - name: Build for amd64 and arm64
        env:
          CGO_ENABLED: '0'
        run: |
          flags="-s -w -X main.version=$GITHUB_REF_NAME -X main.updateRepo=$GITHUB_REPOSITORY"
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$flags" -o "dist/$arch/devtopo" ./cmd/devtopo
            cp LICENSE README.md GUIDE.md "dist/$arch/"
            tar -czf "devtopo-linux-$arch.tar.gz" -C "dist/$arch" devtopo LICENSE README.md GUIDE.md
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: devtopo-linux-*.tar.gz

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      # A release made on the website already exists: its downloads are added to it.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          cp windows/DevTopo.exe macos/DevTopo-mac.zip linux/devtopo-linux-amd64.tar.gz linux/devtopo-linux-arm64.tar.gz assets/
          (cd assets && sha256sum * > SHA256SUMS)
          gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --generate-notes
          gh release upload "$TAG" assets/* --repo "$REPO" --clobber
